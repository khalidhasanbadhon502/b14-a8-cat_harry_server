<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudioSpace — Studio Gallery</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1b1f2a;
      --muted: #6b7280;
      --accent: #4f46e5;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 20px 24px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.35rem; }
    header p { color: var(--muted); font-size: 0.9rem; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    #status { color: var(--muted); padding: 32px 0; text-align: center; }
    #status.error { color: #b91c1c; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
    }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #e5e7eb; }
    .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .title { font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
    .tag {
      font-size: 0.72rem;
      background: #eef2ff;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .stats {
      display: flex;
      gap: 14px;
      font-size: 0.83rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: auto;
    }
    .stats b { color: var(--ink); font-weight: 600; }
    .price { color: var(--accent); font-weight: 700; }
    .host { display: flex; align-items: center; gap: 8px; font-size: 0.83rem; color: var(--muted); }
    .host img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
    .verified { color: #059669; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>StudioSpace</h1>
    <p>Book photo studios, film stages, podcast rooms &amp; more</p>
  </header>
  <main>
    <div id="status">Loading studios…</div>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const gridEl = document.getElementById('grid');

    function card(studio) {
      const el = document.createElement('article');
      el.className = 'card';
      const rating = studio.rating != null ? '★ ' + studio.rating : '';
      el.innerHTML = `
        <img src="${studio.image}" alt="${studio.title}" loading="lazy" />
        <div class="body">
          <div class="row">
            <span class="title">${studio.title}</span>
            <span class="tag">${studio.category}</span>
          </div>
          <div class="meta">${studio.location}</div>
          <div class="host">
            ${studio.host && studio.host.avatar ? `<img src="${studio.host.avatar}" alt="" />` : ''}
            <span>${studio.host ? studio.host.name : 'Host'} ${studio.host && studio.host.verified ? '<span class="verified">✓ verified</span>' : ''}</span>
          </div>
          <div class="stats">
            <span class="price">$${studio.pricePerHour}/hr</span>
            ${rating ? `<span>${rating}</span>` : ''}
            <span><b>${studio.capacity}</b> guests</span>
            <span>Deposit <b>$${studio.securityDeposit}</b></span>
          </div>
        </div>`;
      return el;
    }

    fetch('/api/studios')
      .then((res) => {
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        return res.json();
      })
      .then((studios) => {
        if (!Array.isArray(studios) || studios.length === 0) {
          statusEl.textContent = 'No studios available right now.';
          return;
        }
        statusEl.remove();
        studios.forEach((s) => gridEl.appendChild(card(s)));
      })
      .catch((err) => {
        statusEl.textContent = 'Could not load studios: ' + err.message;
        statusEl.classList.add('error');
      });
  </script>
</body>
</html>
